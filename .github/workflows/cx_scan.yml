name: Checkmarx One Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkmarx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Cx SCA Resolver
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p sca-resolver

          curl \
            --fail \
            --location \
            --retry 3 \
            --output sca-resolver/ScaResolver-musl64.tar.gz \
            https://sca-downloads.s3.amazonaws.com/cli/latest/ScaResolver-musl64.tar.gz

          tar \
            -xzf sca-resolver/ScaResolver-musl64.tar.gz \
            -C sca-resolver

          chmod +x sca-resolver/ScaResolver

          echo "Conteúdo do diretório:"
          ls -la sca-resolver

          test -x sca-resolver/ScaResolver
          test -f sca-resolver/Configuration.yml

      - name: Checkmarx One Scan
        id: checkmarx
        continue-on-error: true
        uses: checkmarx/ast-github-action@2.3.39
        with:
          project_name: ${{ github.repository }}

          cx_tenant: ${{ secrets.CX_TENANT_NAME }}
          base_uri: ${{ secrets.CX_BASE_URI }}
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}

          github_token: ${{ github.token }}
          branch: ${{ github.ref_name }}

          scan_params: >-
            --scan-timeout 120
            --scan-types sast,sca,iac-security,scs
            --sca-resolver /github/workspace/sca-resolver/ScaResolver
            --scs-engines scorecard
            --scs-repo-url "${{ github.server_url }}/${{ github.repository }}"
            --scs-repo-token "${{ github.token }}"

      - name: Exibir resultado do Checkmarx
        if: always()
        shell: bash
        env:
          CHECKMARX_OUTCOME: ${{ steps.checkmarx.outcome }}
          CHECKMARX_SCAN_ID: ${{ steps.checkmarx.outputs.cxScanID }}
          CHECKMARX_OUTPUT: ${{ steps.checkmarx.outputs.cxcli }}
        run: |
          set -uo pipefail

          echo "======================================================"
          echo " Checkmarx One Security Gate"
          echo "======================================================"
          echo "Scan ID: ${CHECKMARX_SCAN_ID:-não disponível}"
          echo "Resultado: ${CHECKMARX_OUTCOME}"
          echo

          echo "::group::Saída completa do Checkmarx CLI"

          if [[ -n "${CHECKMARX_OUTPUT:-}" ]]; then
            printf '%s\n' "${CHECKMARX_OUTPUT}" |
              sed 's/\\n/\n/g'
          else
            echo "Nenhuma saída adicional foi retornada pela action."
          fi

          echo "::endgroup::"

          echo
          echo "Informações relacionadas ao Security Gate:"

          GATE_DETAILS="$(
            printf '%s\n' "${CHECKMARX_OUTPUT:-}" |
              sed 's/\\n/\n/g' |
              grep -iE \
                'policy|policies|violation|violated|break build|threshold|security gate' ||
              true
          )"

          if [[ -n "${GATE_DETAILS}" ]]; then
            printf '%s\n' "${GATE_DETAILS}"
          else
            echo "Nenhuma descrição de policy foi identificada na saída."
          fi

          if [[ "${CHECKMARX_OUTCOME}" != "success" ]]; then
            echo
            echo "::error title=Checkmarx Security Gate reprovado::O scan falhou ou uma policy configurada para Break Build foi violada."
            exit 1
          fi

          echo
          echo "::notice title=Checkmarx Security Gate aprovado::O scan foi concluído sem bloquear o build."
