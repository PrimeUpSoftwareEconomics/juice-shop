name: Checkmarx One Scan

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkmarx One CLI Action
        id: checkmarx
        continue-on-error: true
        uses: checkmarx/ast-github-action@2.3.39
        with:
          project_name: ${{ github.repository }}
          cx_tenant: ${{ secrets.CX_TENANT_NAME }}
          base_uri: ${{ secrets.CX_BASE_URI }}
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          branch: ${{ github.ref }}

          # Aguarda o término do scan por até 120 minutos.
          # Não utilizar --async.
          scan_params: >-
            --scan-timeout 120

      - name: Resultado do Checkmarx Security Gate
        if: always()
        shell: bash
        env:
          CX_OUTCOME: ${{ steps.checkmarx.outcome }}
          CX_SCAN_ID: ${{ steps.checkmarx.outputs.cxScanID }}
          CX_OUTPUT: ${{ steps.checkmarx.outputs.cxcli }}
        run: |
          set -uo pipefail

          echo "======================================================"
          echo " Checkmarx One Security Gate"
          echo "======================================================"
          echo "Scan ID: ${CX_SCAN_ID:-não disponível}"
          echo "Resultado da execução: ${CX_OUTCOME}"
          echo

          echo "::group::Saída retornada pelo Checkmarx CLI"

          if [[ -n "${CX_OUTPUT:-}" ]]; then
            # A action remove as quebras de linha do output.
            # Esta substituição tenta restaurar quebras escapadas.
            printf '%s\n' "${CX_OUTPUT}" | sed 's/\\n/\n/g'
          else
            echo "Nenhuma saída adicional foi retornada."
          fi

          echo "::endgroup::"

          echo
          echo "Informações relacionadas a policies:"

          POLICY_OUTPUT="$(
            printf '%s\n' "${CX_OUTPUT:-}" |
              sed 's/\\n/\n/g' |
              grep -ioE \
                '.{0,150}(policy|policies|violation|violated|break build|security gate).{0,400}' \
                || true
          )"

          if [[ -n "${POLICY_OUTPUT}" ]]; then
            printf '%s\n' "${POLICY_OUTPUT}"
          else
            echo "Nenhuma informação adicional de policy foi encontrada no output."
          fi

          echo

          if [[ "${CX_OUTCOME}" != "success" ]]; then
            echo "::error title=Checkmarx Security Gate reprovado::O scan falhou ou uma policy configurada com Break Build foi violada."
            exit 1
          fi

          echo "::notice title=Checkmarx Security Gate aprovado::O scan foi concluído sem violação bloqueante."
